<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Самостоятельная работа · Информационный объём</title>
<script>
window.MathJax = { tex: { inlineMath: [['$','$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<nav class="nav">
  <div class="nav-in">
    <a class="brand" href="../index.html"><span class="logo">I</span> Информатика · кабинет 318А</a>
    <div class="nav-links">
      <a href="../index.html">Главная</a>
      <a href="../lessons.html" class="active">Уроки</a>
      <a href="../materials.html">Материалы</a>
      <a href="../tests.html">Тесты</a>
      <a href="../oge.html">ОГЭ</a>
      <a href="../about.html">О сайте</a>
    </div>
  </div>
</nav>

<div class="wrap">
  <header class="hero small">
    <h1>Самостоятельная работа</h1>
    <p class="lead">Информационный объём сообщения · 5 задач</p>
  </header>

  <section class="card" id="gate">
    <h2><span class="num">1</span> Вход</h2>
    <div class="grid two">
      <div><label>Фамилия</label><input type="text" id="surname" placeholder="Иванов"></div>
      <div><label>Имя</label><input type="text" id="firstname" placeholder="Иван"></div>
      <div><label>Класс</label><input type="text" id="klass" placeholder="7А"></div>
      <div><label>Пароль</label><input type="password" id="saPass" placeholder="Пароль"></div>
    </div>
    <div class="controls">
      <button class="btn b-blue" onclick="startSA()">Начать работу</button>
    </div>
    <div class="pmsg" id="saMsg"></div>
  </section>

  <section class="card" id="body" style="display:none">
    <h2><span class="num">2</span> Задания</h2>
    <div id="tasks"></div>
    <div class="controls">
      <button class="btn b-green" onclick="finishSA()">Сдать работу</button>
    </div>
    <div class="res" id="res" style="display:none">
      <h3>Результат</h3>
      <div class="marks">
        <div class="mcard"><div class="lbl">Верно</div><div class="val" id="saCorrect">0</div></div>
        <div class="mcard total"><div class="lbl">Оценка</div><div class="val" id="saMark">—</div></div>
      </div>
      <div class="controls" style="margin-top:14px">
        <button class="btn b-orange" onclick="printResult()">🖨 Печать с результатами</button>
        <button class="btn b-teal" onclick="saveJPG()">🖼 Сохранить JPG</button>
      </div>
    </div>
  </section>
</div>

<script>
var SA_PASSWORD = 'виннимед254';
var tasks = [
  {q:'$N = 64$, $K = 128$. Найдите $I$ в битах.', ans:'768'},
  {q:'$I = 2$ Кбайт, $i = 8$ бит. Найдите $K$.', ans:'2048'},
  {q:'$N = 32$, $I = 640$ бит. Найдите $K$.', ans:'128'},
  {q:'$I = 4$ Кбайт, $K = 4096$. Найдите $i$ в битах.', ans:'8'},
  {q:'Сколько байт в 1 Кбайте?', ans:'1024'}
];

function startSA(){
  var s = document.getElementById('surname').value.trim();
  var n = document.getElementById('firstname').value.trim();
  var k = document.getElementById('klass').value.trim();
  var p = document.getElementById('saPass').value;
  if (!s || !n || !k){ document.getElementById('saMsg').textContent='Заполните ФИО и класс'; return; }
  if (!passwordMatches(p, SA_PASSWORD)){ document.getElementById('saMsg').textContent='Неверный пароль'; return; }
  document.getElementById('gate').style.display='none';
  document.getElementById('body').style.display='block';
  var html = '';
  tasks.forEach(function(t,i){
    html += '<div class="task"><p><b>'+(i+1)+'.</b> '+t.q+'</p>'+
            '<input type="text" id="sa'+i+'" placeholder="ответ" inputmode="numeric"></div>';
  });
  document.getElementById('tasks').innerHTML = html;
  MathJax.typesetPromise([document.getElementById('tasks')]).catch(function(){});
}

function finishSA(){
  var correct = 0;
  tasks.forEach(function(t,i){
    var v = (document.getElementById('sa'+i).value||'').trim();
    if (v === t.ans) correct++;
  });
  var mark = correct>=5?5 : correct===4?4 : correct===3?3 : 2;
  document.getElementById('saCorrect').textContent = correct + '/5';
  document.getElementById('saMark').textContent = mark;
  document.getElementById('res').style.display='block';
  window._saResult = {correct:correct, mark:mark, tasks:tasks};
}

function printResult(){
  var r = window._saResult;
  var s = document.getElementById('surname').value.trim();
  var n = document.getElementById('firstname').value.trim();
  var k = document.getElementById('klass').value.trim();
  var rows = r.tasks.map(function(t,i){
    var g = document.getElementById('sa'+i).value.trim();
    var ok = g === t.ans;
    return '<tr><td>'+(i+1)+'</td><td>'+t.q+'</td><td>'+g+'</td><td>'+t.ans+'</td><td>'+(ok?'✅':'❌')+'</td></tr>';
  }).join('');
  var w = window.open('','_blank');
  w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>Самостоятельная</title>'+
    '<style>body{font-family:Georgia,serif;padding:14mm;font-size:12pt}'+
    'table{width:100%;border-collapse:collapse;font-size:11pt}'+
    'td,th{border:1px solid #999;padding:4px 6px}</style></head><body>'+
    '<h1>Самостоятельная работа</h1>'+
    '<p>Ученик: <b>'+s+' '+n+'</b>, класс: <b>'+k+'</b></p>'+
    '<table><tr><th>№</th><th>Задание</th><th>Ответ</th><th>Верно</th><th>✓</th></tr>'+rows+'</table>'+
    '<p>Верно: <b>'+r.correct+'/5</b>, оценка: <b>'+r.mark+'</b></p>'+
    '</body></html>');
  w.document.close();
  setTimeout(function(){ w.print(); }, 500);
}

function saveJPG(){
  var el = document.getElementById('res');
  if (!window.html2canvas){
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = saveJPG;
    document.head.appendChild(s);
    return;
  }
  var s = document.getElementById('surname').value.trim();
  var n = document.getElementById('firstname').value.trim();
  var k = document.getElementById('klass').value.trim();
  html2canvas(el, {backgroundColor:'#fff', scale:2}).then(function(c){
    var a = document.createElement('a');
    a.download = (s+'_'+n+'_'+k+'_самостоятельная.jpg').replace(/[\\/:*?"<>|\s]+/g,'_');
    a.href = c.toDataURL('image/jpeg', 0.93);
    a.click();
  });
}

/* раскладки */
var LAT2CYR = {q:'й',w:'ц',e:'у',r:'к',t:'е',y:'н',u:'г',i:'ш',o:'щ',p:'з',a:'ф',s:'ы',d:'в',f:'а',g:'п',h:'р',j:'о',k:'л',l:'д',z:'я',x:'ч',c:'с',v:'м',b:'и',n:'т',m:'ь'};
function mapKeys(s, t){ return String(s).toLowerCase().split('').map(function(c){return t[c]||c;}).join(''); }
function passwordMatches(t, e){
  t = String(t||'').trim().toLowerCase(); e = String(e||'').trim().toLowerCase();
  if (!t) return false;
  return t === e || mapKeys(t, LAT2CYR) === e;
}
</script>
</body>
</html>
